# Irrigation (Bewässerung)
#
# Weather-aware irrigation for the Sonoff dual valve.
#
# Roles:
#   - Smart Irrigation (UI-configured, HACS): computes each zone's watering
#     duration from evapotranspiration incl. rainfall. It is the sole judge of
#     whether a zone needs water at all - it returns 0 seconds once recent rain
#     has covered the loss, and a zone with 0 seconds is skipped for the day.
#   - Irrigation Unlimited (this file): schedules and runs the valves as one
#     sequence, zone after zone - never both at once (shared supply).
#
# Zone map:
#   Zone A -> switch.sonoff_valve_1
#   Zone B -> switch.sonoff_valve_2
#
# Control model:
#   Irrigation Unlimited owns the schedule and runs the valves in sequence. The
#   05:25 pre-run automation feeds each zone its Smart Irrigation duration (or 0
#   to skip when the master switch is off) via irrigation_unlimited.adjust_time,
#   and raises the valve's own per-run minute cap over MQTT so the device does not
#   cut a run short - and so the valve still self-closes near the intended time if
#   Home Assistant dies mid-run. Config values in irrigation_unlimited are static
#   - only service-call fields accept templates.
#
# Start time is the schedule `time` below. The pre-run automation fires five
# minutes earlier; keep that lead if you change the start time.
#
# There is no independent check that water actually reached the ground: a
# clogged line, an empty supply or a stuck valve is indistinguishable here from
# a schedule that ran correctly.

input_boolean:
  irrigation_enable:
    name: "Bewässerung aktiv"
    icon: mdi:water-pump

input_number:
  # Litres each zone was meant to receive, captured before the run: Smart
  # Irrigation zeroes its bucket the moment a zone's valve closes, so the intent
  # is gone by the time the delivered amount can be read. Zero means "no run was
  # planned", which also disarms the post-run check.
  irrigation_zone_a_expected_litres:
    name: "Bewässerung Zone A - Sollmenge"
    min: 0
    max: 2000
    step: 0.1
    initial: 0
    unit_of_measurement: "L"
    icon: mdi:water
  irrigation_zone_b_expected_litres:
    name: "Bewässerung Zone B - Sollmenge"
    min: 0
    max: 2000
    step: 0.1
    initial: 0
    unit_of_measurement: "L"
    icon: mdi:water

irrigation_unlimited:
  controllers:
    - name: "Garten"
      zones:
        - name: "Zone A"
          entity_id: switch.sonoff_valve_1
          # In-IU run-time clamp; the valve also self-caps on-device.
          maximum: "00:40:00"
        - name: "Zone B"
          entity_id: switch.sonoff_valve_2
          maximum: "00:40:00"
      sequences:
        - name: "Bewässerungslauf"
          schedules:
            - name: "Start"
              time: "05:30"
          zones:
            # Placeholder duration; the pre-run automation overrides it each day
            # via adjust_time (Smart Irrigation seconds, or 0 to skip a zone).
            - zone_id: 1
              duration: "00:05:00"
            - zone_id: 2
              duration: "00:05:00"

automation:
  - id: irrigation_pre_run_adjust
    alias: "Bewässerung - Lauf vorbereiten"
    description: >
      Runs five minutes before the scheduled sequence. Sets each sequence zone's
      run time to the Smart Irrigation duration (evapotranspiration incl. rain),
      or to zero when the master switch is off. Also sets the valve's on-device
      manual_irrigation_duration to the day's longest planned run plus a margin
      (clamped 10-45 min), so losing Home Assistant mid-run closes the valve near
      the intended time instead of at the 45-minute ceiling.
    mode: single
    trigger:
      - platform: time
        at: "05:25:00"
    action:
      # Each zone's effective run: the Smart Irrigation duration, or 0 when the
      # master switch is off.
      - variables:
          zone_a_secs: >-
            {% set on = is_state('input_boolean.irrigation_enable', 'on') %}
            {{ (states('sensor.smart_irrigation_zone_a') | int(0)) if on else 0 }}
          zone_b_secs: >-
            {% set on = is_state('input_boolean.irrigation_enable', 'on') %}
            {{ (states('sensor.smart_irrigation_zone_b') | int(0)) if on else 0 }}
      # Litres owed to each zone: the Smart Irrigation deficit in mm over the zone
      # area. Taken from the deficit rather than the run time on purpose - a wrong
      # throughput shortens the run and the expected litres together, so a run-time
      # comparison would call an under-watered zone healthy.
      - service: input_number.set_value
        target:
          entity_id: input_number.irrigation_zone_a_expected_litres
        data:
          value: >-
            {{ 0 if (zone_a_secs | int(0)) == 0 else
               (((state_attr('sensor.smart_irrigation_zone_a', 'bucket') | float(0)) | abs)
                * (state_attr('sensor.smart_irrigation_zone_a', 'size') | float(0))) | round(1) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.irrigation_zone_b_expected_litres
        data:
          value: >-
            {{ 0 if (zone_b_secs | int(0)) == 0 else
               (((state_attr('sensor.smart_irrigation_zone_b', 'bucket') | float(0)) | abs)
                * (state_attr('sensor.smart_irrigation_zone_b', 'size') | float(0))) | round(1) }}
      # On-device cap = longer planned run + margin, clamped 10-45 min. This is
      # not only a failsafe: the valve closes itself once a switch-driven run
      # reaches this many minutes, so a value below the planned run silently
      # truncates it. Zigbee2MQTT discards a partial composite without error, so
      # every field is sent even though only irrigation_duration changes.
      - service: mqtt.publish
        data:
          topic: "zigbee2mqtt/Sonoff Valve/set"
          payload: >-
            {% set minutes = (([zone_a_secs | int(0), zone_b_secs | int(0)] | max) / 60) | round(0, 'ceil') | int + 1 %}
            {% set capped = [10, [minutes, 45] | min] | max %}
            {{ {"manual_default_settings": {"fail_safe": 45, "irrigation_mode": "duration", "irrigation_duration": capped, "irrigation_amount": 0}} | to_json }}
      # Feed each sequence zone its run time (0 seconds = skipped this cycle).
      - service: irrigation_unlimited.adjust_time
        data:
          entity_id: binary_sensor.irrigation_unlimited_c1_m
          sequence_id: 1
          zones: [1]
          actual: "{{ timedelta(seconds=zone_a_secs | int(0)) }}"
      - service: irrigation_unlimited.adjust_time
        data:
          entity_id: binary_sensor.irrigation_unlimited_c1_m
          sequence_id: 1
          zones: [2]
          actual: "{{ timedelta(seconds=zone_b_secs | int(0)) }}"

  - id: irrigation_delivery_check
    alias: "Bewässerung - Liefermenge prüfen"
    description: >
      Compares what each zone was owed against what the valve's flow meter
      actually delivered, once the sequence ends. Catches a clogged line, a closed
      supply, a stuck valve, and a run the valve cut short at its own minute cap.
      None of those change the switch state or leave anything in the log, so
      without this a failed watering is indistinguishable from a good one.
      A zone whose expected litres are zero was not scheduled and is not checked.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.irrigation_unlimited_c1_m
        from: "on"
        to: "off"
    action:
      # The valve reports its final totals a few seconds after the water stops.
      - delay: "00:00:30"
      - variables:
          problems: >-
            {% set ns = namespace(msgs=[]) %}
            {% for z in [
                 {'n': 1, 'name': 'Zone A', 'exp': states('input_number.irrigation_zone_a_expected_litres') | float(0)},
                 {'n': 2, 'name': 'Zone B', 'exp': states('input_number.irrigation_zone_b_expected_litres') | float(0)}
               ] %}
              {% if z.exp > 0 %}
                {% set s = states('sensor.sonoff_valve_irrigation_schedule_status_' ~ z.n) %}
                {% set amts = s | regex_findall('actual_irrigation_amount.: (\d+)') %}
                {% set aes = s | regex_findall('actual_end_time.: .([0-9T:+-]+)') %}
                {% set ees = s | regex_findall('expected_end_time.: .([0-9T:+-]+)') %}
                {% if amts | length == 0 %}
                  {% set ns.msgs = ns.msgs + [z.name ~ ': das Ventil meldet keine Liefermenge.'] %}
                {% elif (amts[0] | float(0)) < z.exp * 0.8 %}
                  {% set ns.msgs = ns.msgs + [z.name ~ ' hat nur ' ~ (amts[0] | int) ~ ' von ' ~ (z.exp | round(0) | int) ~ ' Litern bekommen.'] %}
                {% endif %}
                {% if aes | length > 0 and ees | length > 0 and as_timestamp(aes[0]) >= as_timestamp(ees[0]) %}
                  {% set ns.msgs = ns.msgs + [z.name ~ ' wurde vom Ventil an seinem Minutenlimit abgeschnitten.'] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.msgs | join(' ') }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ problems | trim | length > 0 }}"
            sequence:
              - service: notify.all_devices
                data:
                  title: "Bewässerung: Lauf unvollständig"
                  message: "{{ problems | trim }} Wasserzufuhr, Ventil und Leitung prüfen."
      # Disarm until the next pre-run capture, so a manual run cannot be judged
      # against a scheduled run's figures.
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.irrigation_zone_a_expected_litres
            - input_number.irrigation_zone_b_expected_litres
        data:
          value: 0

  - id: irrigation_si_reset_bucket
    alias: "Bewässerung - Smart Irrigation Bucket zurücksetzen"
    description: >
      Resets a zone's Smart Irrigation bucket right after its valve finishes a
      run, so the next calculation starts from topped-up soil. A skipped zone's
      valve never turns on, so its bucket is left untouched.
    mode: parallel
    trigger:
      - platform: state
        entity_id: binary_sensor.irrigation_unlimited_c1_z1
        from: "on"
        to: "off"
        id: zone_a
      - platform: state
        entity_id: binary_sensor.irrigation_unlimited_c1_z2
        from: "on"
        to: "off"
        id: zone_b
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: zone_a
            sequence:
              - service: smart_irrigation.reset_bucket
                target:
                  entity_id: sensor.smart_irrigation_zone_a
          - conditions:
              - condition: trigger
                id: zone_b
            sequence:
              - service: smart_irrigation.reset_bucket
                target:
                  entity_id: sensor.smart_irrigation_zone_b
